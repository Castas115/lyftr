apiVersion: v1
kind: PersistentVolume
metadata:
  name: lyftr-data
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: lyftr
    name: lyftr-data
  hostPath:
    path: /opt/lyftr/data
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["pc1"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lyftr-data
  namespace: lyftr
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  volumeName: lyftr-data
  resources:
    requests:
      storage: 2Gi
